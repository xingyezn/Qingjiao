name: Weekly official notice scan

on:
  schedule:
    - cron: "15 9 * * 1"
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-official-notice-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run the automatic official-source review
        run: python3 scripts/weekly_scan.py

      - name: Publish automatically approved notices
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No high-confidence new notices to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: automatically publish verified official notices"
          git push origin HEAD:main
